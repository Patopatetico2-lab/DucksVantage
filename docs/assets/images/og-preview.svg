<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fundo Escuro com Gradiente Cibernético -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#11192c"/>
      <stop offset="100%" stop-color="#151f36"/>
    </linearGradient>

    <!-- Brilho Neon Ciano -->
    <radialGradient id="cyanGlow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Brilho Neon Roxo Max-Power -->
    <radialGradient id="purpleGlow" cx="0.8" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#9e3dff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9e3dff" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente de Borda do Card -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#30415a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9e3dff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Gradiente do Título -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Gradiente do Anel Mascote -->
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00faf3"/>
      <stop offset="50%" stop-color="#2d58de"/>
      <stop offset="100%" stop-color="#9e3dff"/>
    </linearGradient>

    <linearGradient id="duckGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="60%" stop-color="#ffcc19"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>

  <!-- Grade Sutil de Fundo -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Borda de Destaque -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Tag Superior -->
  <g transform="translate(80, 85)">
    <rect width="360" height="38" rx="19" fill="#1f2a42" stroke="#30415a" stroke-width="1.5"/>
    <circle cx="24" cy="19" r="6" fill="#2cd283"/>
    <text x="42" y="24" fill="#00d2ff" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">
      LINUX NATIVO • ZERO TELEMETRIA
    </text>
  </g>

  <!-- Título Principal -->
  <text x="80" y="200" fill="url(#titleGrad)" font-family="'Inter', -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">
    DUCKSVANTAGE
  </text>

  <!-- Subtítulo / Descrição -->
  <text x="80" y="255" fill="#fbfdff" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="700">
    O Lenovo Vantage que o seu Linux sempre mereceu.
  </text>
  
  <text x="80" y="300" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400">
    Controle térmico de precisão com suporte ao perfil Max-Power, limite de carga em 80%,
  </text>
  <text x="80" y="330" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400">
    curva de ventoinhas e pop-up OSD do Fn + Q — consumindo míseros 35 MB de RAM.
  </text>

  <!-- Badges de Recursos Inferiores -->
  <g transform="translate(80, 400)">
    <!-- Badge 1: Modelos -->
    <rect x="0" y="0" width="230" height="54" rx="10" fill="#151f36" stroke="#30415a" stroke-width="1.5"/>
    <text x="20" y="33" fill="#cbd5e1" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600">
      🎮 Legion, LOQ &amp; IdeaPad
    </text>

    <!-- Badge 2: Max-Power -->
    <rect x="250" y="0" width="190" height="54" rx="10" fill="#151f36" stroke="#9e3dff" stroke-width="1.5"/>
    <text x="270" y="33" fill="#c084fc" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700">
      ⚡ Max-Power EC
    </text>

    <!-- Badge 3: 80% Bateria -->
    <rect x="460" y="0" width="200" height="54" rx="10" fill="#151f36" stroke="#2cd283" stroke-width="1.5"/>
    <text x="480" y="33" fill="#2cd283" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700">
      🔋 Limite de 80%
    </text>

    <!-- Badge 4: Fn + Q OSD -->
    <rect x="680" y="0" width="170" height="54" rx="10" fill="#151f36" stroke="#00d2ff" stroke-width="1.5"/>
    <text x="700" y="33" fill="#00d2ff" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700">
      🔔 Fn+Q Wayland
    </text>
  </g>

  <!-- Rodapé do Card -->
  <text x="80" y="540" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="16">
    Python 3 • PyQt6 • ACPI /sys/ • UDEV Rules • 100% Open Source (MIT)
  </text>

  <!-- Mascote / Logo Grande à Direita -->
  <g transform="translate(860, 140)">
    <!-- Escudo / Card do Ícone -->
    <rect x="0" y="0" width="250" height="250" rx="55" fill="#1b2640" stroke="#30415a" stroke-width="4"/>
    
    <!-- Anel Circular Externo -->
    <circle cx="125" cy="115" r="82" stroke="#1e293b" stroke-width="15" fill="none"/>
    <path d="M65 175 A 82 82 0 1 1 185 175" stroke="url(#gaugeGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>
    
    <!-- Patinho Amarelo -->
    <circle cx="125" cy="115" r="50" fill="url(#duckGrad)"/>
    <!-- Olho -->
    <circle cx="145" cy="100" r="7" fill="#0f172a"/>
    <circle cx="147" cy="98" r="2.5" fill="#ffffff"/>
    <!-- Bico -->
    <path d="M165 110 L195 118 L165 126 Z" fill="#ea580c"/>
    <!-- Base LED do Notebook -->
    <rect x="50" y="200" width="150" height="12" rx="6" fill="#00faf3"/>
  </g>
</svg>
