[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ducksvantage"
version = "2.0.0"
description = "Universal Lenovo Vantage replacement for Linux (Legion, LOQ, IdeaPad Gaming, IdeaPad & Yoga)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Patopatetico2-lab" }
]
keywords = ["lenovo", "vantage", "legion", "loq", "ideapad", "linux", "pyqt6", "acpi", "hardware"]

[project.urls]
Homepage = "https://patopatetico2-lab.github.io/DucksVantage/"
Repository = "https://github.com/Patopatetico2-lab/DucksVantage"
Documentation = "https://patopatetico2-lab.github.io/DucksVantage/"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.4.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0.0",
]

[project.optional-dependencies]
pyside6 = ["PySide6>=6.4.0"]

[project.scripts]
ducksvantage = "main:main"

[project.gui-scripts]
ducksvantage-gui = "main:main"

[tool.setuptools]
py-modules = ["main", "ui_main", "test_backend"]
packages = ["core", "ui", "ui.tabs"]
include-package-data = true

